<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LyraDB 天琴智库 · 轻量 AI 数据库管理工具</title>
    <!-- 首帧前从同源脚本恢复主题偏好，兼容 script-src 'self'。 -->
    <script src="/theme-init.js"></script>
    <style>
        /* V7 启动画面（内联，先于打包 CSS 生效） */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: #F8FAFC;
            transition: opacity 0.35s ease;
        }

        html.dark #splash {
            background: #0F172A;
        }

        #splash.splash-leave {
            opacity: 0;
            pointer-events: none;
        }

        #splash .splash-logo {
            width: 64px;
            height: 64px;
            color: #1E3A5F;
            animation: splash-pulse 1.6s ease-in-out infinite;
        }

        html.dark #splash .splash-logo {
            color: #60A5FA;
        }

        #splash .splash-name {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.12em;
            color: #1E3A5F;
        }

        html.dark #splash .splash-name {
            color: #E2E8F0;
        }

        #splash .splash-bar {
            width: 120px;
            height: 3px;
            border-radius: 2px;
            background: rgba(30, 58, 95, 0.15);
            overflow: hidden;
        }

        html.dark #splash .splash-bar {
            background: rgba(96, 165, 250, 0.2);
        }

        #splash .splash-bar::after {
            content: '';
            display: block;
            width: 40%;
            height: 100%;
            border-radius: 2px;
            background: #1E3A5F;
            animation: splash-slide 1.1s ease-in-out infinite;
        }

        html.dark #splash .splash-bar::after {
            background: #60A5FA;
        }

        @keyframes splash-pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.75;
                transform: scale(0.96);
            }
        }

        @keyframes splash-slide {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(350%);
            }
        }
    </style>
</head>

<body>
    <!-- V7 启动画面：Vue 挂载完成后由 main.ts 淡出移除 -->
    <div id="splash" aria-hidden="true">
        <svg class="splash-logo" viewBox="0 0 48 48" fill="none">
            <ellipse cx="24" cy="11" rx="15" ry="5.5" stroke="currentColor" stroke-width="2" />
            <path d="M9 11 v26 c0 3 6.7 5.5 15 5.5 s15 -2.5 15 -5.5 V11" stroke="currentColor" stroke-width="2" />
            <path d="M9 24 c0 3 6.7 5.5 15 5.5 s15 -2.5 15 -5.5" stroke="currentColor" stroke-width="2" opacity="0.5" />
            <path d="M19 20 l5 9 5 -9" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" opacity="0.9" />
        </svg>
        <div class="splash-name">LYRADB</div>
        <div class="splash-bar"></div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
</body>

</html>
