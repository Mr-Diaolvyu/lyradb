name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端质量门禁
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: 安装 Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装锁定依赖
        working-directory: frontend
        run: npm ci

      - name: 静态检查
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck

      - name: 单元测试
        working-directory: frontend
        run: npm run test

      - name: 生产构建
        working-directory: frontend
        run: npm run build

  backend:
    name: 后端与部署配置
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: 安装 JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 验证后端
        working-directory: backend
        run: mvn -B -ntp clean verify

      - name: 校验 Compose 生产配置
        env:
          JASYPT_PASSWORD: ci-only-jasypt-key-not-for-production
          LYRADB_DB_PASSWORD: ci-only-database-password
          LYRADB_BOOTSTRAP_ADMIN_USERNAME: ciadmin
          LYRADB_BOOTSTRAP_ADMIN_PASSWORD: Ci-Only-Strong-Password-2026!
          CORS_ALLOWED_ORIGINS: https://lyradb.example.test
        run: docker compose config --quiet

      - name: 构建镜像并以空卷启动
        env:
          COMPOSE_PROJECT_NAME: lyradb-ci-${{ github.run_id }}
          LYRADB_IMAGE_TAG: ci-${{ github.run_id }}
          LYRADB_PORT: '18080'
          LYRADB_EDITION: enterprise
          JASYPT_PASSWORD: ci-only-jasypt-key-not-for-production
          LYRADB_DB_PASSWORD: ci-only-database-password
          LYRADB_BOOTSTRAP_ADMIN_USERNAME: ciadmin
          LYRADB_BOOTSTRAP_ADMIN_PASSWORD: Ci-Only-Strong-Password-2026!
          LYRADB_BOOTSTRAP_ADMIN_DISPLAY_NAME: CI 管理员
          CORS_ALLOWED_ORIGINS: http://localhost:18080
          LYRADB_COOKIE_SECURE: 'false'
        run: |
          docker compose up --detach --build --wait --wait-timeout 240
          container_id="$(docker compose ps --quiet lyradb)"
          test -n "$container_id"
          test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "10001:10001"
          curl --fail --silent --show-error http://127.0.0.1:18080/api/app/info

      - name: 输出容器诊断信息
        if: always()
        env:
          COMPOSE_PROJECT_NAME: lyradb-ci-${{ github.run_id }}
          LYRADB_IMAGE_TAG: ci-${{ github.run_id }}
          LYRADB_PORT: '18080'
          LYRADB_EDITION: enterprise
          JASYPT_PASSWORD: ci-only-jasypt-key-not-for-production
          LYRADB_DB_PASSWORD: ci-only-database-password
          LYRADB_BOOTSTRAP_ADMIN_USERNAME: ciadmin
          LYRADB_BOOTSTRAP_ADMIN_PASSWORD: Ci-Only-Strong-Password-2026!
          LYRADB_BOOTSTRAP_ADMIN_DISPLAY_NAME: CI 管理员
          CORS_ALLOWED_ORIGINS: http://localhost:18080
          LYRADB_COOKIE_SECURE: 'false'
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200 lyradb

      - name: 清理 CI 容器与卷
        if: always()
        env:
          COMPOSE_PROJECT_NAME: lyradb-ci-${{ github.run_id }}
          LYRADB_IMAGE_TAG: ci-${{ github.run_id }}
          LYRADB_PORT: '18080'
          LYRADB_EDITION: enterprise
          JASYPT_PASSWORD: ci-only-jasypt-key-not-for-production
          LYRADB_DB_PASSWORD: ci-only-database-password
          LYRADB_BOOTSTRAP_ADMIN_USERNAME: ciadmin
          LYRADB_BOOTSTRAP_ADMIN_PASSWORD: Ci-Only-Strong-Password-2026!
          LYRADB_BOOTSTRAP_ADMIN_DISPLAY_NAME: CI 管理员
          CORS_ALLOWED_ORIGINS: http://localhost:18080
          LYRADB_COOKIE_SECURE: 'false'
        run: docker compose down --volumes --remove-orphans

  android:
    name: Android 构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: 安装 JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Gradle 8.2.1
        uses: gradle/actions/setup-gradle@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: '8.2.1'

      - name: 校验并构建 Debug APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
