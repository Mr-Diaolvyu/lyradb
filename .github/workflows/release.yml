# 标签发布：构建任务只读仓库；发布任务单独获得 contents: write。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    name: 构建 Windows 便携包
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: 安装 Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 JDK 21（含 jpackage）
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 校验标签与各端版本一致
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "发布标签必须是 v主版本.次版本.修订号，实际：${{ github.ref_name }}"
          }

          $versions = [ordered]@{}
          $versions["frontend"] = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version
          $versions["backend"] = ([xml](Get-Content backend/pom.xml -Raw)).project.properties.revision
          $androidText = Get-Content mobile/android/app/build.gradle.kts -Raw
          $versions["android"] = [regex]::Match(
            $androidText,
            'versionName\s*=\s*"([^"]+)"'
          ).Groups[1].Value
          $iosPlist = [xml](Get-Content mobile/ios/LyraDB/Info.plist -Raw)
          $iosEntries = $iosPlist.plist.dict.ChildNodes
          for ($index = 0; $index -lt $iosEntries.Count - 1; $index++) {
            if ($iosEntries[$index].Name -eq "key" -and
                $iosEntries[$index].InnerText -eq "CFBundleShortVersionString") {
              $versions["ios"] = $iosEntries[$index + 1].InnerText
              break
            }
          }
          $versions["harmony"] = (Get-Content mobile/harmony/AppScope/app.json5 -Raw |
            ConvertFrom-Json).app.versionName

          foreach ($entry in $versions.GetEnumerator()) {
            if ($entry.Value -ne $version) {
              throw "版本不一致：$($entry.Key)=$($entry.Value)，标签=$version"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 安装前端锁定依赖
        working-directory: frontend
        run: npm ci

      - name: 前端质量门禁
        working-directory: frontend
        run: |
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: 嵌入前端静态资源
        shell: pwsh
        run: |
          $static = [System.IO.Path]::GetFullPath("backend/src/main/resources/static")
          $expected = [System.IO.Path]::GetFullPath("backend/src/main/resources")
          if (-not $static.StartsWith($expected, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "拒绝清理意外路径：$static"
          }
          if (Test-Path -LiteralPath $static) {
            Remove-Item -LiteralPath $static -Recurse -Force
          }
          New-Item -ItemType Directory -Path $static | Out-Null
          Copy-Item -Path "frontend/dist/*" -Destination $static -Recurse -Force

      - name: 后端测试并生成 jpackage 应用镜像
        timeout-minutes: 15
        working-directory: backend
        run: mvn -B -ntp -Pdesktop clean verify "-Drevision=${{ steps.version.outputs.version }}"

      - name: 运行 Windows 便携包冒烟测试
        timeout-minutes: 3
        shell: pwsh
        run: |
          $executable = [System.IO.Path]::GetFullPath(
            "backend/target/desktop/LyraDB/LyraDB.exe"
          )
          $launcherConfig = [System.IO.Path]::GetFullPath(
            "backend/target/desktop/LyraDB/app/LyraDB.cfg"
          )
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "jpackage 产物缺失：$executable"
          }
          if (-not (Test-Path -LiteralPath $launcherConfig)) {
            throw "jpackage 启动配置缺失：$launcherConfig"
          }
          $launcherText = Get-Content -LiteralPath $launcherConfig -Raw
          if ($launcherText -notmatch '(?m)^app\.mainjar=') {
            throw "jpackage 启动配置未声明主 JAR"
          }
          if ($launcherText -match
              '(?m)^app\.mainclass=io\.github\.lexaquila\.lyradb\.LyraDbApplication') {
            throw "jpackage 错误地绕过了 Spring Boot JarLauncher"
          }

          $mainJar = [System.IO.Path]::GetFullPath(
            "backend/target/desktop/LyraDB/app/" +
            "lyradb-backend-${{ steps.version.outputs.version }}.jar"
          )
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [System.IO.Compression.ZipFile]::OpenRead($mainJar)
          try {
            $manifestEntry = $archive.GetEntry("META-INF/MANIFEST.MF")
            if (-not $manifestEntry) {
              throw "主 JAR 缺少 MANIFEST.MF"
            }
            $reader = [System.IO.StreamReader]::new($manifestEntry.Open())
            try {
              $manifest = $reader.ReadToEnd()
            } finally {
              $reader.Dispose()
            }
          } finally {
            $archive.Dispose()
          }
          if ($manifest -notmatch
              '(?m)^Main-Class: org\.springframework\.boot\.loader\.launch\.JarLauncher\r?$') {
            throw "主 JAR Manifest 未使用 Spring Boot JarLauncher"
          }

          $workspace = [System.IO.Path]::GetFullPath("数据架构师工作空间")
          New-Item -ItemType Directory -Path $workspace -Force | Out-Null
          $smokePath = [System.IO.Path]::GetFullPath(
            (Join-Path $workspace "release-desktop-smoke-${{ github.run_id }}")
          )
          if (-not $smokePath.StartsWith(
              $workspace + [System.IO.Path]::DirectorySeparatorChar,
              [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "拒绝使用工作区外的冒烟测试目录：$smokePath"
          }
          if (Test-Path -LiteralPath $smokePath) {
            Remove-Item -LiteralPath $smokePath -Recurse -Force
          }
          New-Item -ItemType Directory -Path $smokePath | Out-Null

          $listener = [System.Net.Sockets.TcpListener]::new(
            [System.Net.IPAddress]::Loopback, 0
          )
          $listener.Start()
          try {
            $port = $listener.LocalEndpoint.Port
          } finally {
            $listener.Stop()
          }

          $env:LYRADB_H2_PATH = Join-Path $smokePath "data/lyradb"
          $env:LYRADB_DESKTOP_KEY_PATH = Join-Path $smokePath "master.key"
          $env:LOGGING_FILE_NAME = Join-Path $smokePath "lyradb.log"
          $process = $null
          try {
            $startInfo = [System.Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = $executable
            $startInfo.Arguments = (
              "--server.port=$port --app.desktop.tray-enabled=false"
            )
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo = $startInfo
            if (-not $process.Start()) {
              throw "无法启动 LyraDB.exe"
            }

            $ready = $false
            $deadline = (Get-Date).AddSeconds(90)
            do {
              $process.Refresh()
              if ($process.HasExited) {
                $process.WaitForExit()
                throw "LyraDB.exe 提前退出，退出码：$($process.ExitCode)"
              }
              try {
                $response = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:$port/api/app/info" `
                  -UseBasicParsing `
                  -TimeoutSec 3
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                # 服务启动期间连接失败属于预期，继续轮询。
              }
              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $deadline)

            if (-not $ready) {
              throw "LyraDB.exe 在 90 秒内未通过 HTTP 就绪检查"
            }
            Write-Output "Windows 便携包启动验证通过：127.0.0.1:$port"
          } catch {
            $logPath = Join-Path $smokePath "lyradb.log"
            if (Test-Path -LiteralPath $logPath) {
              Get-Content -LiteralPath $logPath -Tail 200
            }
            throw
          } finally {
            if ($process -and -not $process.HasExited) {
              $process.Kill()
              $process.WaitForExit()
            }
            if ($process) {
              $process.Dispose()
            }
            for ($attempt = 1;
                 $attempt -le 10 -and (Test-Path -LiteralPath $smokePath);
                 $attempt++) {
              try {
                Remove-Item -LiteralPath $smokePath -Recurse -Force -ErrorAction Stop
              } catch {
                if ($attempt -eq 10) {
                  throw
                }
                Start-Sleep -Milliseconds 500
              }
            }
          }

      - name: 生成 CycloneDX SBOM
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $metadata = [System.IO.Path]::GetFullPath("release-metadata")
          New-Item -ItemType Directory -Path $metadata | Out-Null

          Push-Location frontend
          try {
            npm sbom --sbom-format cyclonedx |
              Set-Content -Encoding utf8 (Join-Path $metadata "lyradb-frontend-$version.cdx.json")
            if ($LASTEXITCODE -ne 0) {
              throw "前端 SBOM 生成失败，退出码：$LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

          Push-Location backend
          try {
            mvn -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom `
              "-Drevision=$version" `
              "-DoutputFormat=json" `
              "-DoutputName=bom" `
              "-DincludeTestScope=false"
            if ($LASTEXITCODE -ne 0) {
              throw "后端 SBOM 生成失败，退出码：$LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }
          Copy-Item -LiteralPath "backend/target/bom.json" `
            -Destination (Join-Path $metadata "lyradb-backend-$version.cdx.json")

          Get-ChildItem -LiteralPath $metadata -Filter "*.json" | ForEach-Object {
            Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }

      - name: 生成便携包与校验和
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $image = "backend/target/desktop/LyraDB"
          $executable = Join-Path $image "LyraDB.exe"
          $jar = "backend/target/lyradb-backend-$version.jar"
          $zip = "backend/target/LyraDB-$version-windows-x64-portable.zip"
          if (-not (Test-Path -LiteralPath $executable)) {
            throw "jpackage 产物缺失：$executable"
          }
          if (-not (Test-Path -LiteralPath $jar)) {
            throw "服务端产物缺失：$jar"
          }
          Compress-Archive -Path $image -DestinationPath $zip -CompressionLevel Optimal

          $stage = [System.IO.Path]::GetFullPath("release-assets")
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item -LiteralPath $zip, $jar -Destination $stage
          Copy-Item -Path "release-metadata/*.cdx.json" -Destination $stage

          $checksums = Get-ChildItem -LiteralPath $stage -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksums | Set-Content -Encoding ascii (Join-Path $stage "SHA256SUMS.txt")

      - name: 上传待发布产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          path: release-assets/*

  attest:
    name: 生成制品来源证明
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: 下载已验证产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: 生成 Sigstore/SLSA 来源证明
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: release-assets/*

  publish:
    name: 发布 GitHub Release
    needs: [build-windows, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载已验证产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: 发布
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.3.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/LyraDB-*-windows-x64-portable.zip
            release-assets/lyradb-backend-*.jar
            release-assets/lyradb-*.cdx.json
            release-assets/SHA256SUMS.txt
