# 标签发布：个人版原生桌面与企业版服务端分别构建；发布任务单独获得 contents: write。
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    name: 构建个人原生桌面与企业服务端
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 检出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false

      - name: 安装 Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装 JDK 21（含 jpackage）
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 校验标签与各端版本一致
        id: version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $tagMatch = [regex]::Match($tag, '^v(?<version>\d+\.\d+\.\d+)$')
          if (-not $tagMatch.Success) {
            throw "发布标签必须严格使用 v主版本.次版本.修订号，实际：$tag"
          }
          $version = $tagMatch.Groups["version"].Value

          $versions = [ordered]@{}
          $versions["root"] = ([xml](Get-Content pom.xml -Raw)).project.properties.revision
          $versions["core"] = ([xml](Get-Content core/pom.xml -Raw)).project.properties.revision
          $versions["desktop"] = ([xml](Get-Content desktop/pom.xml -Raw)).project.properties.revision
          $versions["backend"] = ([xml](Get-Content backend/pom.xml -Raw)).project.properties.revision
          $versions["frontend"] = (Get-Content frontend/package.json -Raw | ConvertFrom-Json).version

          $lockVersions = @(
            & node -e "const lock = require('./frontend/package-lock.json'); console.log(lock.version); console.log(lock.packages[''].version);"
          )
          $lockCommandExitCode = $LASTEXITCODE
          $emptyLockVersions = @(
            $lockVersions | Where-Object { [string]::IsNullOrWhiteSpace($_) }
          )
          if ($lockCommandExitCode -ne 0 -or $lockVersions.Count -ne 2 -or
              $emptyLockVersions.Count -gt 0) {
            throw "无法读取 frontend/package-lock.json 顶层版本或根包版本"
          }
          $versions["frontend-lock"] = $lockVersions[0].Trim()
          $versions["frontend-lock-root"] = $lockVersions[1].Trim()

          $androidText = Get-Content mobile/android/app/build.gradle.kts -Raw
          $androidVersion = [regex]::Match(
            $androidText, 'versionName\s*=\s*"([^"]+)"'
          )
          $androidBuild = [regex]::Match(
            $androidText, 'versionCode\s*=\s*(\d+)'
          )
          if (-not $androidVersion.Success -or -not $androidBuild.Success) {
            throw "无法读取 Android versionName/versionCode"
          }
          $versions["android"] = $androidVersion.Groups[1].Value

          $iosPlist = [xml](Get-Content mobile/ios/LyraDB/Info.plist -Raw)
          $iosEntries = $iosPlist.plist.dict.ChildNodes
          $iosBuild = $null
          for ($index = 0; $index -lt $iosEntries.Count - 1; $index++) {
            if ($iosEntries[$index].Name -eq "key") {
              if ($iosEntries[$index].InnerText -eq "CFBundleShortVersionString") {
                $versions["ios"] = $iosEntries[$index + 1].InnerText
              } elseif ($iosEntries[$index].InnerText -eq "CFBundleVersion") {
                $iosBuild = $iosEntries[$index + 1].InnerText
              }
            }
          }
          if (-not $versions.Contains("ios") -or [string]::IsNullOrWhiteSpace($iosBuild)) {
            throw "无法读取 iOS CFBundleShortVersionString/CFBundleVersion"
          }

          $harmony = (Get-Content mobile/harmony/AppScope/app.json5 -Raw |
            ConvertFrom-Json).app
          $versions["harmony"] = $harmony.versionName

          foreach ($entry in $versions.GetEnumerator()) {
            if ($entry.Value -ne $version) {
              throw "版本不一致：$($entry.Key)=$($entry.Value)，标签=$version"
            }
          }

          $parts = $version.Split(".") | ForEach-Object { [int64]$_ }
          if ($parts[1] -gt 999 -or $parts[2] -gt 999) {
            throw "次版本和修订号必须小于 1000，才能生成唯一移动端 build code：$version"
          }
          $expectedBuild = $parts[0] * 1000000 + $parts[1] * 1000 + $parts[2]
          if ($expectedBuild -gt [int]::MaxValue) {
            throw "移动端 build code 超出 32 位整数范围：$expectedBuild"
          }
          $buildCodes = [ordered]@{
            "android" = [int64]$androidBuild.Groups[1].Value
            "ios" = [int64]$iosBuild
            "harmony" = [int64]$harmony.versionCode
          }
          foreach ($entry in $buildCodes.GetEnumerator()) {
            if ($entry.Value -ne $expectedBuild) {
              throw "移动端 build code 不一致：$($entry.Key)=$($entry.Value)，预期=$expectedBuild"
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 企业版前端质量门禁
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: 嵌入企业版前端静态资源
        shell: pwsh
        run: |
          $static = [System.IO.Path]::GetFullPath("backend/src/main/resources/static")
          $expected = [System.IO.Path]::GetFullPath("backend/src/main/resources")
          if (-not $static.StartsWith($expected, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "拒绝清理意外路径：$static"
          }
          if (Test-Path -LiteralPath $static) {
            Remove-Item -LiteralPath $static -Recurse -Force
          }
          New-Item -ItemType Directory -Path $static | Out-Null
          Copy-Item -Path "frontend/dist/*" -Destination $static -Recurse -Force

      - name: 验证 core 并构建企业版后端
        timeout-minutes: 15
        run: >
          mvn -B -ntp -pl backend -am clean verify
          "-Drevision=${{ steps.version.outputs.version }}"

      - name: 构建个人版原生桌面并执行 EXE 冒烟
        timeout-minutes: 15
        shell: pwsh
        run: ./package-desktop.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: 生成 CycloneDX SBOM
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $metadata = [System.IO.Path]::GetFullPath("release-metadata")
          New-Item -ItemType Directory -Path $metadata -Force | Out-Null

          Push-Location frontend
          try {
            npm sbom --sbom-format cyclonedx |
              Set-Content -Encoding utf8 (Join-Path $metadata "lyradb-frontend-$version.cdx.json")
            if ($LASTEXITCODE -ne 0) {
              throw "前端 SBOM 生成失败，退出码：$LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

          $javaBom = Join-Path $metadata "lyradb-java-$version.cdx.json"
          mvn -B -ntp `
            org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom `
            "-Drevision=$version" `
            "-DoutputFormat=json" `
            "-DoutputName=lyradb-java-$version.cdx" `
            "-DoutputDirectory=$metadata" `
            "-DoutputReactorProjects=false" `
            "-DincludeTestScope=false" `
            "-Dcyclonedx.skipNotDeployed=false" `
            "-Dcyclonedx.skipAttach=true"
          if ($LASTEXITCODE -ne 0) {
            throw "Java 聚合 SBOM 生成失败，退出码：$LASTEXITCODE"
          }
          if (-not (Test-Path -LiteralPath $javaBom)) {
            throw "Java 聚合 SBOM 未生成到预期路径：$javaBom"
          }

          Get-ChildItem -LiteralPath $metadata -Filter "*.json" | ForEach-Object {
            Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json | Out-Null
          }

      - name: 汇总产物与 SHA-256
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "desktop/target/LyraDB-$version-windows-x64-portable.zip"
          $jar = "backend/target/lyradb-backend-$version.jar"
          foreach ($artifact in @($zip, $jar)) {
            if (-not (Test-Path -LiteralPath $artifact)) {
              throw "发布产物缺失：$artifact"
            }
          }

          $stage = [System.IO.Path]::GetFullPath("release-assets")
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -LiteralPath $zip, $jar -Destination $stage
          Copy-Item -Path "release-metadata/*.cdx.json" -Destination $stage

          $checksums = Get-ChildItem -LiteralPath $stage -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksumPath = Join-Path $stage "SHA256SUMS.txt"
          $checksumText = ($checksums -join "`n") + "`n"
          [System.IO.File]::WriteAllText(
            $checksumPath,
            $checksumText,
            [System.Text.UTF8Encoding]::new($false)
          )
          if ([System.IO.File]::ReadAllText($checksumPath).Contains("`r")) {
            throw "SHA256SUMS 必须使用 LF 换行"
          }

      - name: 上传待发布产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          if-no-files-found: error
          retention-days: 7
          path: release-assets/*

  attest:
    name: 生成制品来源证明
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: 下载已验证产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: 在 Linux 校验发布附件 SHA-256
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: 生成 Sigstore/SLSA 来源证明
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: release-assets/*

  publish:
    name: 发布 GitHub Release
    needs: [build-windows, attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载已验证产物
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: 发布
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.3.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            个人版：真正的原生桌面数据库工作台，内置本地 AI 配置；不启动浏览器、WebView 或本地 HTTP 服务。
            企业版：继续以独立 B/S 服务端 JAR 交付。
          files: |
            release-assets/LyraDB-*-windows-x64-portable.zip
            release-assets/lyradb-backend-*.jar
            release-assets/lyradb-*.cdx.json
            release-assets/SHA256SUMS.txt
