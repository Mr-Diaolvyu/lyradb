# LyraDB 企业版安全默认部署。
#
# 1. 复制 .env.example 为 .env，填写所有必填项。
# 2. 默认仅绑定宿主机回环地址，建议由同机 HTTPS 反向代理对外提供服务。
# 3. 本文件只交付企业 B/S；个人版请使用 GitHub Release 中的原生桌面便携包。
services:
  lyradb:
    build:
      context: .
    image: lyradb:${LYRADB_IMAGE_TAG:-3.1.0}
    user: "10001:10001"
    ports:
      - "127.0.0.1:${LYRADB_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      LYRADB_EDITION: ${LYRADB_EDITION:-enterprise}

      # 加密、元数据库口令与 CORS 始终必填。
      JASYPT_PASSWORD: ${JASYPT_PASSWORD:?请在 .env 中设置 JASYPT_PASSWORD}
      LYRADB_DB_PASSWORD: ${LYRADB_DB_PASSWORD:?请在 .env 中设置 LYRADB_DB_PASSWORD}

      # 仅企业空用户库首次启动必填；初始化成功后应从 .env/容器环境移除。
      # 应用会在空库且变量缺失时失败关闭，已初始化实例允许传空。
      LYRADB_BOOTSTRAP_ADMIN_USERNAME: ${LYRADB_BOOTSTRAP_ADMIN_USERNAME:-}
      LYRADB_BOOTSTRAP_ADMIN_PASSWORD: ${LYRADB_BOOTSTRAP_ADMIN_PASSWORD:-}
      LYRADB_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${LYRADB_BOOTSTRAP_ADMIN_DISPLAY_NAME:-平台管理员}
      LYRADB_BOOTSTRAP_ADMIN_EMAIL: ${LYRADB_BOOTSTRAP_ADMIN_EMAIL:-}

      # 反向代理使用 HTTPS 时保持 true；仅本机 HTTP 验证时才显式设为 false。
      LYRADB_COOKIE_SECURE: ${LYRADB_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?请设置浏览器访问来源，例如 https://db.example.com}

      # 默认禁止 Webhook 与自定义 AI 出站；按精确主机白名单显式开放。
      LYRADB_WEBHOOK_ALLOWED_HOSTS: ${LYRADB_WEBHOOK_ALLOWED_HOSTS:-}
      LYRADB_AI_ALLOWED_HOSTS: ${LYRADB_AI_ALLOWED_HOSTS:-}
    volumes:
      - lyradb-data:/app/data
      - lyradb-drivers:/home/lyradb/.lyradb
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  lyradb-data:
  lyradb-drivers:
