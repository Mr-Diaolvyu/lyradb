# 生产环境配置（默认启用企业安全链）
server:
  servlet:
    session:
      timeout: ${LYRADB_SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${LYRADB_COOKIE_SECURE:true}
        same-site: strict

spring:
  datasource:
    url: jdbc:h2:file:${LYRADB_H2_PATH:./data/lyradb};DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: ${LYRADB_DB_USER:sa}
    password: ${LYRADB_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD}

app:
  edition: ${LYRADB_EDITION:enterprise}
  enterprise:
    cookie-secure: ${LYRADB_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "Content-Type,Accept,X-XSRF-TOKEN"

logging:
  level:
    io.github.lexaquila.lyradb: INFO
    org.hibernate.SQL: WARN
    org.springframework: WARN
