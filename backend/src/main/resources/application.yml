# 公共配置（所有 profile 共享）
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: lyradb
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # 结构变更只能通过 Flyway；Hibernate 仅验证实体与数据库是否一致。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# 仅用于读取历史 Jasypt 密文；新凭证由 CredentialService 使用 AES-256-GCM 写入。
jasypt:
  encryptor:
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

app:
  version: ${LYRADB_VERSION:3.1.2}
  edition: ${LYRADB_EDITION:personal}
  driver-cache-dir: ${user.home}/.lyradb/drivers
  max-connections-per-db: 10
  max-query-rows: 10000
  query-timeout-seconds: 60

  audit:
    mask-sql: ${LYRADB_AUDIT_MASK_SQL:true}

  # 默认拒绝任意出站目标；多项用逗号分隔，支持精确主机和 *.example.com。
  outbound:
    webhook-allowed-hosts: ${LYRADB_WEBHOOK_ALLOWED_HOSTS:}
    ai-allowed-hosts: ${LYRADB_AI_ALLOWED_HOSTS:}

  enterprise:
    bootstrap-admin-username: ${LYRADB_BOOTSTRAP_ADMIN_USERNAME:}
    bootstrap-admin-password: ${LYRADB_BOOTSTRAP_ADMIN_PASSWORD:}
    bootstrap-admin-display-name: ${LYRADB_BOOTSTRAP_ADMIN_DISPLAY_NAME:平台管理员}
    bootstrap-admin-email: ${LYRADB_BOOTSTRAP_ADMIN_EMAIL:}
    cookie-secure: ${LYRADB_COOKIE_SECURE:false}

  ai:
    ask-lyra-enabled: ${LYRADB_AI_ASK_ENABLED:true}
    knowledge-core-enabled: ${LYRADB_AI_KNOWLEDGE_ENABLED:false}
    governed-read-agent-enabled: ${LYRADB_AI_READ_AGENT_ENABLED:false}
    team-knowledge-loop-enabled: ${LYRADB_AI_TEAM_KNOWLEDGE_ENABLED:false}
    quality-enabled: ${LYRADB_AI_QUALITY_ENABLED:false}
    max-compute-agent-enabled: ${LYRADB_AI_MAXCOMPUTE_AGENT_ENABLED:false}
    agent-gateway-enabled: ${LYRADB_AI_GATEWAY_ENABLED:false}
    # 3.x 服务端硬门禁；设为 true 会拒绝启动，不能用环境变量绕过。
    write-agent-enabled: ${LYRADB_AI_WRITE_AGENT_ENABLED:false}
    max-knowledge-context-chars: ${LYRADB_AI_MAX_KNOWLEDGE_CONTEXT_CHARS:12000}
    knowledge-semantic-enabled: ${LYRADB_AI_KNOWLEDGE_SEMANTIC_ENABLED:false}
    knowledge-embedding-model: ${LYRADB_AI_KNOWLEDGE_EMBEDDING_MODEL:text-embedding-v3}
    knowledge-lexical-weight: ${LYRADB_AI_KNOWLEDGE_LEXICAL_WEIGHT:0.65}
    max-compute-live-evidence-enabled: ${LYRADB_AI_MAXCOMPUTE_LIVE_EVIDENCE_ENABLED:false}
    max-compute-live-evidence-required: ${LYRADB_AI_MAXCOMPUTE_LIVE_EVIDENCE_REQUIRED:false}
    gateway-requests-per-minute: ${LYRADB_AI_GATEWAY_REQUESTS_PER_MINUTE:120}
    gateway-expensive-requests-per-minute: ${LYRADB_AI_GATEWAY_EXPENSIVE_REQUESTS_PER_MINUTE:20}
    gateway-allowed-origins: ${LYRADB_AI_GATEWAY_ALLOWED_ORIGINS:}
    mcp-max-request-bytes: ${LYRADB_AI_MCP_MAX_REQUEST_BYTES:1048576}
    private-model-enabled: ${LYRADB_AI_PRIVATE_MODEL_ENABLED:false}
    private-model-allowed-hosts: ${LYRADB_AI_PRIVATE_MODEL_ALLOWED_HOSTS:}
    private-model-require-https: ${LYRADB_AI_PRIVATE_MODEL_REQUIRE_HTTPS:true}
    execution-node-id: ${LYRADB_AI_EXECUTION_NODE_ID:}
    cancel-poll-interval-ms: ${LYRADB_AI_CANCEL_POLL_INTERVAL_MS:1000}
    read-agent-plan-ttl-seconds: ${LYRADB_AI_READ_AGENT_PLAN_TTL_SECONDS:300}
    read-agent-max-rows: ${LYRADB_AI_READ_AGENT_MAX_ROWS:1000}
    read-agent-max-estimated-cost-micros: ${LYRADB_AI_READ_AGENT_MAX_COST_MICROS:0}

logging:
  level:
    io.github.lexaquila.lyradb: DEBUG
    org.hibernate.SQL: WARN
    org.springframework: INFO
