# 开发环境配置
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict

spring:
  datasource:
    url: jdbc:h2:file:./data/lyradb;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: ${LYRADB_H2_CONSOLE_ENABLED:false}
      path: /h2-console

# 开发环境也不再内置固定密钥；启动前必须显式提供。
jasypt:
  encryptor:
    password: ${JASYPT_PASSWORD:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "Content-Type,Accept,X-XSRF-TOKEN"
